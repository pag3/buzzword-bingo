<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#1e2a44"/>
  <!-- Paper tiles -->
  <g fill="#f7f5f0">
    <rect x="204" y="76" width="104" height="104" rx="16"/>
    <rect x="332" y="76" width="104" height="104" rx="16"/>
    <rect x="76" y="204" width="104" height="104" rx="16"/>
    <rect x="332" y="204" width="104" height="104" rx="16"/>
    <rect x="76" y="332" width="104" height="104" rx="16"/>
    <rect x="204" y="332" width="104" height="104" rx="16"/>
  </g>
  <!-- A highlighter swipe on one marked tile -->
  <rect x="340" y="106" width="88" height="44" rx="8" fill="#ffd633" transform="rotate(-6 384 128)"/>
  <!-- The winning diagonal -->
  <g fill="#66bb6a">
    <rect x="76" y="76" width="104" height="104" rx="16"/>
    <rect x="204" y="204" width="104" height="104" rx="16"/>
    <rect x="332" y="332" width="104" height="104" rx="16"/>
  </g>
</svg>
