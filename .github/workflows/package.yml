name: Package apps

# Builds installable packages for every platform. Run it manually from the
# Actions tab, or push a tag matching the package.json version (e.g. v1.1.0).
# Download the results from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  # A v* tag must match the version the packages will carry, or the stores
  # would get builds labelled with the wrong version. Fails fast, before the
  # slow builds start.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}. Tag v${version} instead, or bump the version first."
            exit 1
          fi
          echo "Building version ${version}"

  microsoft-store:
    needs: check-version
    runs-on: windows-latest
    env:
      # Set these under Settings > Secrets and variables > Actions > Variables,
      # using the values from Partner Center > Product identity.
      MS_STORE_IDENTITY_NAME: ${{ vars.MS_STORE_IDENTITY_NAME }}
      MS_STORE_PUBLISHER: ${{ vars.MS_STORE_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Apply Store identity
        if: env.MS_STORE_IDENTITY_NAME != ''
        run: npm run store:identity
      # Unsigned .msixbundle (x64 + arm64). The Microsoft Store signs it.
      - run: npm run dist:store
      - uses: actions/upload-artifact@v7
        with:
          name: buzzword-bingo-microsoft-store
          path: src-tauri/target/msix/*
          if-no-files-found: error

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run dist:desktop -- --bundles dmg
      - uses: actions/upload-artifact@v7
        with:
          name: buzzword-bingo-macos
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  linux:
    needs: check-version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run dist:desktop -- --bundles appimage,deb
      - uses: actions/upload-artifact@v7
        with:
          name: buzzword-bingo-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  android:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build && npx cap sync android
      # Unsigned debug APK for testing on a device. Build the signed release
      # bundle (.aab) for Google Play from Android Studio (see docs/PUBLISHING.md).
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: buzzword-bingo-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
