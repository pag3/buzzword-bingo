[package]
name = "buzzword-bingo"
version = "1.0.0"
description = "Buzzword Bingo"
authors = ["Paul A. Gusmorino 3rd"]
license = "MIT"
repository = "https://github.com/pag3/buzzword-bingo"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzzword_bingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }

# Optimise release builds for size; the app does almost no native work.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
